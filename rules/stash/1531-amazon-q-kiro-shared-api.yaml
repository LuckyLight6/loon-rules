# name: amazon-q-kiro-shared-api
# priority: 1531
# section: ai
# description: Amazon Q 与 Kiro 共用 API
# boundary: 两个产品的官方网络清单同时列出的精确API；共用范围按完整用途表求交集。不能按目的域名区分调用产品；分别选路时单独配置本组，不接管其他AWS服务或API子域。
