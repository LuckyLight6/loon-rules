domain_suffix_set:
  - "grok.com"
  - "grok.x.com"
  - "x.ai"
domain_regex_set:
  - "(?i)^.*\\.grokusercontent\\.com$"
domain_set:
  - "accounts.spacexsi.com"
  - "auth.grokipedia.com"
