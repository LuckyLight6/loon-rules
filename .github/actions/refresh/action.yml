name: Maintain public proxy rules
description: Verify, refresh and publish the public rule outputs from the checked-out main branch
inputs:
  github-token:
    description: Temporary GitHub Actions token for public API access
    required: true
runs:
  using: composite
  steps:
    - name: Install the maintenance package
      shell: bash
      run: |
        python3 -m venv .venv
        .venv/bin/python -m pip install --editable .
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Verify current rules
      shell: bash
      run: |
        python3 -B -m unittest discover -s checks
        python3 -B maintain.py --verify-files
        python3 -B maintain.py --check-exports
    - uses: ./.github/actions/source-trust
    - name: Check sources and refresh rules
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        python3 -B maintain.py --refresh
        python3 -B scoped_dns.py
        python3 -B scoped_dns.py --check
        python3 -B maintain.py --verify-files
        python3 -B maintain.py --export
        python3 -B maintain.py --check-exports
    - uses: ./.github/actions/native-formats
    - name: Compare complete community inputs
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        python3 -B maintain.py --community-review --sing-box "$RUNNER_TEMP/loon-rule-native/sing-box"
        cat build/community-review/summary.md >> "$GITHUB_STEP_SUMMARY"
    - name: Retain complete community comparison
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: community-review-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/community-review/report.json
          build/community-review/summary.md
        if-no-files-found: error
        retention-days: 90
        compression-level: 9
    - name: Summarize source changes
      shell: bash
      run: |
        sed "s#](../docs/#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/#g" build/verification.md >> "$GITHUB_STEP_SUMMARY"
    - name: Commit validated outputs
      shell: bash
      run: |
        git add -- rules/ plugins/public-services-doh.plugin data/public-suffix-list.dat data/maintenance-state.json data/community-state.json
        if git diff --cached --quiet; then
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'Refresh validated proxy rule files'
        git push origin HEAD:refs/heads/main
