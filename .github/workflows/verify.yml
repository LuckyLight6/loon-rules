name: Check subscription changes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the maintenance package
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --editable .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python3 -B -m unittest discover -s checks
      - run: python3 -B maintain.py --verify-files
      - run: python3 -B maintain.py --check-exports
      - run: python3 -B scoped_dns.py --check
      - uses: ./.github/actions/native-formats
      - uses: ./.github/actions/source-trust
      - run: python3 -B maintain.py --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Explain Apple source TLS failures
        if: failure()
        run: |
          for loon_source_host in gdmf.apple.com init.ess.apple.com init.itunes.apple.com configuration.ls.apple.com; do
            echo "TLS chain: $loon_source_host"
            timeout 10 openssl s_client -showcerts -verify_return_error \
              -connect "$loon_source_host:443" -servername "$loon_source_host" \
              -CAfile "$CURL_CA_BUNDLE" </dev/null 2>&1 \
              | sed -n '/^depth=/p; /^verify error/p; /^[[:space:]][0-9]*[[:space:]]s:/p; /^[[:space:]]*i:/p; /^Verification error:/p' || true
          done
