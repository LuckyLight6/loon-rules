name: Check subscription changes
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s checks
      - run: python3 -B maintain.py --verify-files
      - run: python3 -B scoped_dns.py --check
      - run: python3 -B maintain.py --check
