name: Refresh Loon rules

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-loon-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify current rules
        run: |
          python3 -B -m unittest discover -s checks
          python3 -B maintain.py --verify-files
      - name: Check sources and refresh rules
        run: |
          python3 -B maintain.py --refresh
          python3 -B scoped_dns.py
          python3 -B scoped_dns.py --check
          python3 -B maintain.py --verify-files
      - name: Summarize source changes
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          result=json.loads(Path('status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report:
              print(f"读取 {result['inputs-read']} / {result['inputs-requested']} 个来源；更新 {len(result['changed'])} 份订阅。",file=report)
              for source, state in result['official-endpoints'].items():
                  if held:=state.get('outside-confirmed-scope'):
                      print(f"- {source}：{held} 个官方新主机尚未确认归属，未发布",file=report)
              for source, state in result['source-inventories'].items():
                  if state['state']!='current':
                      print(f"- {source}：{state['state']}，未归属范围 {state.get('outside-scope','—')}",file=report)
              for group, state in result['reviewed-inputs'].items():
                  if state['state']!='current':
                      print(f"- {group}：{state['state']}（新范围 {state.get('new-matches','—')}，缺少 {state.get('missing-rules','—')}）",file=report)
          PYTHON
      - name: Commit validated outputs
        run: |
          git add -- ':(glob)rules/*.lsr' plugins/public-services-doh.plugin status.json REVIEW.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated Loon rule files'
          git push origin HEAD:refs/heads/main
