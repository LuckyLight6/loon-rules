name: Refresh Loon rules

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-loon-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify current rules
        run: |
          python3 -B -m unittest discover -s checks
          python3 -B maintain.py --verify-files
      - name: Check sources and refresh rules
        run: |
          python3 -B maintain.py --refresh
          python3 -B maintain.py --verify-files
      - name: Commit validated outputs
        run: |
          git add -- ':(glob)rules/*.lsr' status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated Loon rule files'
          git push origin HEAD:refs/heads/main
