name: Refresh Loon rules

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-loon-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the maintenance package
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --editable .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify current rules
        run: |
          python3 -B -m unittest discover -s checks
          python3 -B maintain.py --verify-files
      - uses: ./.github/actions/source-trust
      - name: Check sources and refresh rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B maintain.py --refresh
          python3 -B scoped_dns.py
          python3 -B scoped_dns.py --check
          python3 -B maintain.py --verify-files
      - name: Summarize source changes
        run: cat build/verification.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit validated outputs
        run: |
          git add -- ':(glob)rules/*.lsr' plugins/public-services-doh.plugin data/public-suffix-list.dat data/maintenance-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated Loon rule files'
          git push origin HEAD:refs/heads/main
