name: Refresh Loon rules

on:
  schedule:
    - cron: '37 3,15 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: refresh-loon-rules-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Maintain public rules
        uses: ./.github/actions/refresh
        with:
          github-token: ${{ github.token }}
