[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loon-rules-maintainer"
version = "0.1.0"
description = "Generate and verify service rules for supported proxy clients"
requires-python = ">=3.10"
dependencies = ["tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0", "markdown-it-py==4.0.0"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
loon-rules = "loon_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loon_rules*"]
namespaces = false
